<!-- Used in: article-comments.html -->
<form class="comment-form surface-paper radius-panel pad-4" id="commentForm">
  <label class="text-label text-1 color-body" for="commentText">Add a comment</label>
  <textarea class="control-input width-full surface-muted color-body text-body text-2 pad-3 radius-card margin-top-2" id="commentText" name="comment" maxlength="1000" required="" rows="4" placeholder="Share a thoughtful response"></textarea>
  <div class="flex align-center justify-between gap-3 margin-top-3"><span class="text-caption text-1 color-muted">Be constructive and specific.</span><button class="control-button color-inverse text-label text-1" type="submit">Post Comment</button></div>
</form>
