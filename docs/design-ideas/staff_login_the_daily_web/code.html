sktop"><main class="w-full max-w-md"><div class="flex flex-col w-full">
<div class="bg-surface-container-lowest rounded-xl shadow-md p-space-xl flex flex-col items-center">
<!-- Masthead / Brand Emblem -->
<div class="w-full flex flex-col items-center mb-space-lg">
<div class="w-56 max-w-full flex items-center justify-center">
<img alt="The Daily Web Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Xq-TfzTvaz8iwXoa4pPlpaSH3HMgs03iq6LB2W5K2nGSknby3P4VyuwDkSb65u-mFjsh0NDXNzUJNjfZTTODbRRvfqNoyJMADexPerVulOc2P5jQiLGWHflcx13JZkALpHdc7O58_MaE9f6S-DbRN7ruh97uvhc5ZNjj5eIq7oGdHf1hjuhCzJyMdQcNDUQ8hdEjLEM9rC5f3QkylMMMggO5bVYfX2bYBx2qarWvppU-Pfe9MGms8h-q2o"/>
</div>
<div class="flex items-center gap-space-xs mt-space-xs">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-caps text-label-caps uppercase tracking-wider text-secondary">Broadsheet CMS Network</span>
</div>
</div>
<!-- Editorial Auth Header -->
<div class="w-full text-center mb-space-lg">
<h1 class="font-headline-md text-headline-md text-on-surface">Staff &amp; Reporter Login</h1>
<p class="font-body-sm text-body-sm text-secondary mt-space-xxs">Enter your credentials to access the editorial portal</p>
</div>
<!-- Academic Evaluation Notice -->
<div class="w-full bg-secondary-container rounded-lg p-space-sm mb-space-lg">
<div class="flex items-start gap-space-xs">
<span class="font-label-md text-label-md text-on-secondary-fixed uppercase tracking-wide">Demo Accounts</span>
</div>
<div class="mt-space-xxs font-body-sm text-body-sm text-on-secondary-container leading-relaxed">
<div><strong class="font-label-md text-on-secondary-fixed">Reporter:</strong> reporter@dailyweb.org / pass123</div>
<div><strong class="font-label-md text-on-secondary-fixed">Editor:</strong> editor@dailyweb.org / pass123</div>
</div>
</div>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-space-md" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Input -->
<div class="flex flex-col gap-space-xxs">
<label class="font-label-md text-label-md text-on-surface" for="staffEmail">Editorial Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-space-md py-space-sm rounded-lg outline-none focus:bg-surface-container-lowest transition-colors placeholder:text-outline-variant" id="staffEmail" name="email" placeholder="e.g. reporter@dailyweb.org" required="" type="email"/>
</div>
</div>
<!-- Password Input with Recovery Link -->
<div class="flex flex-col gap-space-xxs">
<div class="flex justify-between items-baseline">
<label class="font-label-md text-label-md text-on-surface" for="staffPassword">Security Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-space-md py-space-sm rounded-lg outline-none focus:bg-surface-container-lowest transition-colors placeholder:text-outline-variant" id="staffPassword" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Persistence Checkbox -->
<div class="flex items-center gap-space-xs mt-space-xxs">
<input class="w-4 h-4 accent-primary rounded cursor-pointer" id="rememberMe" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-secondary cursor-pointer select-none" for="rememberMe">
          Remember me on this workstation
        </label>
</div>
<!-- Submission Button -->
<button class="w-full mt-space-xs py-space-sm px-space-md bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:bg-surface-variant hover:text-on-surface transition-all flex items-center justify-center gap-space-xs active:scale-[0.99]" id="signInBtn" type="submit">
<span>Sign In to Terminal</span>
<span class="font-body-sm text-body-sm">→</span>
</button>
<!-- Feedback Banner -->
<div class="hidden text-center py-space-xs px-space-sm rounded-lg font-body-sm text-body-sm mt-space-xxs" id="statusMessage"></div>
</form>
<!-- Navigation Escape Link -->
<div class="mt-space-xl pt-space-md w-full flex justify-center">
<a class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors flex items-center gap-space-xs" href="#">
<span>←</span>
<span>Return to public website</span>
</a>
</div>
</div>
<!-- Terminal Telemetry Footer -->
<div class="mt-space-md flex justify-between items-center px-space-xs text-secondary font-caption text-caption">
<span>Broadsheet CMS Engine 4.19</span>
<span class="flex items-center gap-space-xxs">
<span class="w-1.5 h-1.5 rounded-full bg-secondary opacity-60"></span>
      SSL Encrypted Gateway
    </span>
</div>
<script>
    function handleLogin(e) {
      e.preventDefault();
      const emailInput = document.getElementById('staffEmail').value.trim();
      const passInput = document.getElementById('staffPassword').value;
      const statusBox = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('signInBtn');

      submitBtn.classList.add('opacity-75');
      submitBtn.innerText = 'Authenticating...';

      setTimeout(() => {
        submitBtn.classList.remove('opacity-75');
        submitBtn.innerHTML = '<span>Sign In to Terminal</span> <span class="font-body-sm text-body-sm">→</span>';

        if ((emailInput === 'reporter@dailyweb.org' || emailInput === 'editor@dailyweb.org') && passInput === 'pass123') {
          statusBox.className = 'w-full text-center py-space-xs px-space-sm rounded-lg font-body-sm text-body-sm mt-space-xxs bg-surface-container-high text-on-surface';
          statusBox.textContent = 'Verification successful. Launching workspace desk...';
        } else {
          statusBox.className = 'w-full text-center py-space-xs px-space-sm rounded-lg font-body-sm text-body-sm mt-space-xxs bg-error-container text-on-error-container';
          statusBox.textContent = 'Invalid credentials. Please refer to student demo accounts.';
        }
      }, 550);
    }
  </script>
</div></main></body></html>
