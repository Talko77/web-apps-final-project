<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Daily Web - Authentication</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap"
      rel="stylesheet"
    />
    <link href="styles/style.css" rel="stylesheet" />
  </head>
  <body
    class="surface-page text-body text-2 color-body height-screen flex align-center justify-center pad-5"
  >
    <main class="width-full width-reading">
      <div class="flex flex-column width-full">
        <div
          class="surface-paper radius-panel shadow-raised pad-6 flex flex-column align-center"
        >
          <!-- Masthead / Brand Emblem -->
          <div class="width-full flex flex-column align-center margin-bottom-5">
            <div
              class="width-reading width-full flex align-center justify-center"
            >
              <img
                alt="The Daily Web Logo"
                class="width-full"
                src="https://lh3.googleusercontent.com/aida/AEtjO1Xq-TfzTvaz8iwXoa4pPlpaSH3HMgs03iq6LB2W5K2nGSknby3P4VyuwDkSb65u-mFjsh0NDXNzUJNjfZTTODbRRvfqNoyJMADexPerVulOc2P5jQiLGWHflcx13JZkALpHdc7O58_MaE9f6S-DbRN7ruh97uvhc5ZNjj5eIq7oGdHf1hjuhCzJyMdQcNDUQ8hdEjLEM9rC5f3QkylMMMggO5bVYfX2bYBx2qarWvppU-Pfe9MGms8h-q2o"
              />
            </div>
            <div class="flex align-center gap-2 margin-top-2">
              <span
                class="avatar-small radius-pill surface-alert state-loading"
              ></span>
              <span class="text-label text-1 text-uppercase color-muted"
                >Broadsheet CMS Network</span
              >
            </div>
          </div>
          <!-- Editorial Auth Header -->
          <div class="width-full text-center margin-bottom-5">
            <h1 class="text-headline text-5 color-body">
              Staff &amp; Reporter Login
            </h1>
            <p class="text-body text-1 color-muted margin-top-2">
              Enter your credentials to access the editorial portal
            </p>
          </div>
          <!-- Academic Evaluation Notice -->
          <div
            class="width-full surface-info radius-card pad-3 margin-bottom-5"
          >
            <div class="flex align-start gap-2">
              <span class="text-label text-1 color-info text-uppercase"
                >Demo Accounts</span
              >
            </div>
            <div class="margin-top-2 text-body text-1 color-info text-relaxed">
              <div>
                <strong class="text-label text-1 color-info">Reporter:</strong>
                reporter@dailyweb.org / pass123
              </div>
              <div>
                <strong class="text-label text-1 color-info">Editor:</strong>
                editor@dailyweb.org / pass123
              </div>
            </div>
          </div>
          <!-- Authentication Form -->
          <form
            class="width-full flex flex-column gap-4"
            id="loginForm"
            onsubmit="handleLogin(event)"
          >
            <!-- Email Input -->
            <div class="flex flex-column gap-1">
              <label class="text-label text-1 color-body" for="staffEmail"
                >Editorial Email</label
              >
              <div class="relative">
                <input
                  class="width-full surface-muted color-body text-body text-2 pad-inline-4 pad-block-3 radius-card control-input motion-colors"
                  id="staffEmail"
                  name="email"
                  placeholder="e.g. reporter@dailyweb.org"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <!-- Password Input with Recovery Link -->
            <div class="flex flex-column gap-1">
              <div class="flex justify-between align-center">
                <label class="text-label text-1 color-body" for="staffPassword"
                  >Security Password</label
                >
                <a class="text-body text-1 color-muted motion-colors" href="#"
                  >Forgot password?</a
                >
              </div>
              <div class="relative">
                <input
                  class="width-full surface-muted color-body text-body text-2 pad-inline-4 pad-block-3 radius-card control-input motion-colors"
                  id="staffPassword"
                  name="password"
                  placeholder="••••••••••••"
                  required=""
                  type="password"
                />
              </div>
            </div>
            <!-- Persistence Checkbox -->
            <div class="flex align-center gap-2 margin-top-2">
              <input
                class="avatar-small radius-standard control-pointer"
                id="rememberMe"
                name="remember"
                type="checkbox"
              />
              <label
                class="text-body text-1 color-muted control-pointer control-no-select"
                for="rememberMe"
              >
                Remember me on this workstation
              </label>
            </div>
            <!-- Submission Button -->
            <button
              class="width-full margin-top-2 pad-block-3 pad-inline-4 surface-ink color-inverse text-label text-2 radius-card shadow-subtle motion-all flex align-center justify-center gap-2"
              id="signInBtn"
              type="submit"
            >
              <span>Sign In to Terminal</span>
              <span class="text-body text-1">→</span>
            </button>
            <!-- Feedback Banner -->
            <div
              class="state-hidden text-center pad-block-2 pad-inline-3 radius-card text-body text-1 margin-top-2"
              id="statusMessage"
            ></div>
          </form>
          <!-- Navigation Escape Link -->
          <div class="margin-top-6 margin-top-4 width-full flex justify-center">
            <a
              class="text-body text-1 color-muted motion-colors flex align-center gap-2"
              href="#"
            >
              <span>←</span>
              <span>Return to public website</span>
            </a>
          </div>
        </div>
        <!-- Terminal Telemetry Footer -->
        <div
          class="margin-top-4 flex justify-between align-center pad-inline-3 color-muted text-caption text-1"
        >
          <span>Broadsheet CMS Engine 4.19</span>
          <span class="flex align-center gap-1">
            <span
              class="avatar-small radius-pill surface-info state-muted"
            ></span>
            SSL Encrypted Gateway
          </span>
        </div>
        <script>
          function handleLogin(e) {
            e.preventDefault();
            const emailInput = document
              .getElementById("staffEmail")
              .value.trim();
            const passInput = document.getElementById("staffPassword").value;
            const statusBox = document.getElementById("statusMessage");
            const submitBtn = document.getElementById("signInBtn");

            submitBtn.classList.add("state-muted");
            submitBtn.innerText = "Authenticating...";

            setTimeout(() => {
              submitBtn.classList.remove("state-muted");
              submitBtn.innerHTML =
                '<span>Sign In to Terminal</span> <span class="text-body text-1">→</span>';

              if (
                (emailInput === "reporter@dailyweb.org" ||
                  emailInput === "editor@dailyweb.org") &&
                passInput === "pass123"
              ) {
                statusBox.className =
                  "width-full text-center pad-block-2 pad-inline-3 radius-card text-body text-1 margin-top-2 surface-raised color-body";
                statusBox.textContent =
                  "Verification successful. Launching workspace desk...";
              } else {
                statusBox.className =
                  "width-full text-center pad-block-2 pad-inline-3 radius-card text-body text-1 margin-top-2 surface-alert color-alert";
                statusBox.textContent =
                  "Invalid credentials. Please refer to student demo accounts.";
              }
            }, 550);
          }
        </script>
      </div>
    </main>
  </body>
</html>
